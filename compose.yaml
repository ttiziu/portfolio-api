services:
  api:
    image: ghcr.io/ttiziu/portfolio-api:latest
    container_name: portfolio-api
    restart: unless-stopped
    pull_policy: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:7700:7700"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
