name: Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ttiziu/portfolio-api

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Deploy portfolio-api
        run: |
          set -e

          cd /home/jherry/servers/apps/backend/portfolio-api

          docker compose pull
          docker compose up -d

          echo "Esperando healthcheck..."

          for i in {1..18}; do
            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              portfolio-api)

            echo "Estado: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Deploy correcto"
              docker image prune -f
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "El backend quedó unhealthy"
              docker logs portfolio-api --tail 100
              exit 1
            fi

            sleep 5
          done

          echo "Timeout esperando que el backend esté healthy"
          docker logs portfolio-api --tail 100
          exit 1
